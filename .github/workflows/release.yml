name: Release

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Repository-relative release specification
        required: true
        default: versions/0.7.0/release-es.json
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build, attest and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require an existing tag ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "::error::Release workflow must be dispatched with --ref <existing-tag>."
            exit 1
          fi

      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Show release environment
        shell: bash
        run: |
          set -euo pipefail
          python --version
          git --version
          gh --version
          gh release verify --help >/dev/null
          gh release verify-asset --help >/dev/null
          gh attestation verify --help >/dev/null
          printf 'ref=%s\nsha=%s\n' "$GITHUB_REF" "$GITHUB_SHA"

      - name: Byte-compile release tooling
        run: python -m compileall -q tools

      - name: Verify tag and release source state
        env:
          RELEASE_SPEC: ${{ inputs.spec }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_guard.py preflight \
            --repo . \
            --tag-ref "$GITHUB_REF" \
            --checkout-commit "$GITHUB_SHA" \
            --main-ref refs/remotes/origin/main \
            --spec "$RELEASE_SPEC"

      - name: Run protected test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Prepare empty output directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e release-out ]]; then
            echo "::error::release-out already exists; refusing to reuse output state."
            exit 1
          fi
          mkdir release-out

      - name: Build reproducible release artifacts
        env:
          RELEASE_SPEC: ${{ inputs.spec }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_release.py \
            --repo . \
            --spec "$RELEASE_SPEC" \
            --output-dir release-out \
            --release-tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA"

      - name: Verify generated release outputs
        run: >-
          python tools/release_guard.py verify-outputs
          --repo .
          --output-dir release-out

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-out/*

      - name: Verify provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          for artifact in release-out/*; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners >/dev/null
          done

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path("release-out")
          manifests = list(out.glob("*.manifest.json"))
          if len(manifests) != 1:
              raise SystemExit("expected exactly one release manifest")

          manifest = json.loads(manifests[0].read_text(encoding="utf-8"))
          checksums = out / manifest["checksums_filename"]
          notes = (
              "# qupath-es release\n\n"
              f"- Tag: `{manifest['release_tag']}`\n"
              f"- Source commit: `{manifest['source_commit']}`\n"
              f"- QuPath: `{manifest['qupath_version']}`\n"
              f"- Locale: `{manifest['locale']}`\n\n"
              "The ZIP is built reproducibly from Git blobs. The release also "
              "contains a manifest, SPDX 2.3 SBOM and SHA256SUMS file.\n\n"
              "## SHA-256\n\n```text\n"
              + checksums.read_text(encoding="ascii")
              + "```\n\n"
              "Verify provenance with:\n\n```text\n"
              f"gh release verify {manifest['release_tag']} "
              f"-R {os.environ['GITHUB_REPOSITORY']}\n"
              "```\n"
          )

          target = Path(os.environ["RUNNER_TEMP"]) / "qupath-es-release-notes.md"
          target.write_text(notes, encoding="utf-8", newline="\n")
          print(target)
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-out/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/qupath-es-release-notes.md"

      - name: Verify published release and every asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release verify "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null

          for artifact in release-out/*; do
            gh release verify-asset "$GITHUB_REF_NAME" "$artifact" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
          done
