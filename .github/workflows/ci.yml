name: CI

# Runs on every push to main and on every pull request, including pull
# requests from forks. A fork PR runs with a read-only token and no access to
# secrets, so it can validate a proposal without being able to change anything
# in this repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Show environment
        run: |
          python --version
          echo "No third-party dependencies are installed on purpose:"
          echo "the tooling uses the standard library only."

      - name: Byte-compile the tools
        run: python -m compileall -q tools

      - name: Run the test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  tests-windows:
    name: tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Show environment
        run: |
          python --version
          Write-Output "No third-party dependencies are installed on purpose."

      - name: Show InstanSeg bundle line endings
        shell: pwsh
        run: |
          git ls-files --eol components/instanseg/l10n/v0.1.7/dist/strings_es.properties
          git check-attr text -- components/instanseg/l10n/v0.1.7/dist/strings_es.properties

      - name: Byte-compile the tools
        run: python -m compileall -q tools

      - name: Run the test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  integrity:
    name: canonical bundle integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # The canonical English bundle is captured from an official QuPath
      # release and is immutable. Its bytes must survive a fresh clone
      # unchanged, which is why .gitattributes marks it '-text'.
      - name: Canonical bundle matches its recorded fingerprint
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          failures = []

          for fingerprint in sorted(Path("versions").glob("*/fingerprint.json")):
              data = json.loads(fingerprint.read_text(encoding="utf-8"))
              version_dir = fingerprint.parent

              for name, artifact in data.get("artifacts", {}).items():
                  path = version_dir / artifact["path"]
                  if not path.is_file():
                      failures.append(f"{path}: missing")
                      continue

                  raw = path.read_bytes()
                  digest = hashlib.sha256(raw).hexdigest().upper()

                  if digest != artifact["sha256"]:
                      failures.append(
                          f"{path}: sha256 {digest} != recorded {artifact['sha256']}"
                      )
                  if len(raw) != artifact["bytes"]:
                      failures.append(
                          f"{path}: {len(raw)} bytes != recorded {artifact['bytes']}"
                      )
                  print(f"OK {path} ({len(raw)} bytes)")

          if failures:
              print("\nFAILURES:")
              for f in failures:
                  print(" ", f)
              sys.exit(1)

          print("\nAll canonical artifacts match their fingerprints.")
          PY

      - name: Released bundles validate against their canonical base
        run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path

          failed = False

          for base in sorted(Path("versions").glob("*/base/qupath-gui-strings.properties")):
              dist = base.parent.parent / "dist" / "qupath-gui-strings_es.properties"
              if not dist.is_file():
                  print(f"skip {base.parent.parent.name}: no released bundle")
                  continue

              print(f"\n=== {base.parent.parent.name} ===")
              result = subprocess.run(
                  [sys.executable, "tools/translation_validator.py", str(base), str(dist)]
              )
              if result.returncode != 0:
                  failed = True

          sys.exit(1 if failed else 0)
          PY

  component_detection:
    name: component detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      components: ${{ steps.detect.outputs.components }}
      has_components: ${{ steps.detect.outputs.has_components }}

    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Detect affected extension components
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            workflow_dispatch)
              python tools/ci_component_matrix.py \
                --repo . \
                --all \
                --head "$CURRENT_SHA" \
                --github-output "$GITHUB_OUTPUT"
              ;;
            pull_request)
              python tools/ci_component_matrix.py \
                --repo . \
                --base "$BASE_SHA" \
                --head "$HEAD_SHA" \
                --github-output "$GITHUB_OUTPUT"
              ;;
            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
                python tools/ci_component_matrix.py \
                  --repo . \
                  --all \
                  --head "$CURRENT_SHA" \
                  --github-output "$GITHUB_OUTPUT"
              else
                python tools/ci_component_matrix.py \
                  --repo . \
                  --base "$BEFORE_SHA" \
                  --head "$CURRENT_SHA" \
                  --github-output "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error::Unsupported CI event: $EVENT_NAME"
              exit 1
              ;;
          esac

  component_check:
    name: component (${{ matrix.component }})
    needs: component_detection
    if: needs.component_detection.outputs.has_components == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.component_detection.outputs.components) }}

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify component state
        shell: bash
        env:
          COMPONENT_ID: ${{ matrix.component }}
        run: |
          set -euo pipefail
          python tools/component_ci.py --repo . --component "$COMPONENT_ID"
