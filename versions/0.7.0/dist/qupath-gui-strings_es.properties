Action.Help.welcome = Mostrar mensaje de bienvenida
Action.Help.welcome.description = Mostrar el mensaje de bienvenida que aparece la primera vez que se inicia QuPath
Action.Help.docs = Documentación (web)
Action.Help.docs.description = Abrir la documentación principal de QuPath en un navegador web
Action.Help.video = Canal de YouTube (web)
Action.Help.video.description = Abrir el canal de YouTube de QuPath en un navegador web para ver vídeos de demostración y tutoriales
Action.Help.updates = Buscar actualizaciones (web)
Action.Help.updates.description = Buscar en línea actualizaciones de QuPath y de las extensiones compatibles
Action.Help.cite = Citar QuPath en un artículo (web)
Action.Help.cite.description = ¡Cite la publicación de QuPath si usa el software!\nEste comando abre una página web que explica cómo hacerlo.
Action.Help.issues = Notificar un error (web)
Action.Help.issues.description = Abrir en un navegador web la página de incidencias de QuPath para notificar un error.\nSiga la plantilla de informe de errores y use el foro para las preguntas generales.
Action.Help.forum = Ver el foro de usuarios (web)
Action.Help.forum.description = Visitar el foro de usuarios en image.sc.\nEs el lugar para preguntar sobre QuPath y para responder y ayudar a otros usuarios.
Action.Help.source = Ver el código fuente (web)
Action.Help.source.description = Ver el código fuente de QuPath en GitHub
Action.Help.license = Licencia
Action.Help.license.description = Ver la información de licencia de QuPath y de sus dependencias de terceros
Action.Help.systemInfo = Información del sistema
Action.Help.systemInfo.description = Ver información técnica sobre esta instalación de QuPath

# Submenu name for deprecated commands
Menu.deprecated = Obsoletos



# Built-in extension commands (may be moved elsewhere)
Extension.ImageJ = Extensión ImageJ
Extension.ImageJ.description = Comandos de QuPath que permiten la integración con ImageJ - https://imagej.nih.gov/ij/

Action.ImageJ.superpixelsSLIC = Segmentación en superpíxeles SLIC...
Action.ImageJ.superpixelsSLIC.description = Crear teselas de superpíxeles mediante el método SLIC
Action.ImageJ.superpixelsDoG = Segmentación en superpíxeles DoG...
Action.ImageJ.superpixelsDoG.description = Crear teselas de superpíxeles mediante un método de diferencia de gaussianas

Action.ImageJ.tilesToAnnotations = Clasificaciones de teselas a anotaciones...
Action.ImageJ.tilesToAnnotations.description = Fusionar las teselas que comparten la misma clasificación para convertirlas en anotaciones

Action.ImageJ.pixelCount = Recuento de píxeles positivos...
Action.ImageJ.pixelCount.description = Cuantificación por área de los píxeles positivos con tinción DAB.\nEste comando no gestiona bien las regiones grandes; si es posible, normalmente conviene usar la clasificación de píxeles en su lugar.
Action.ImageJ.simpleTissueDetection = Detección simple de tejido...
Action.ImageJ.simpleTissueDetection.description = Detectar regiones grandes mediante un método sencillo de umbralización.\nEste comando no es muy flexible y no permite previsualizar los resultados; si es posible, normalmente conviene usar la clasificación de píxeles en su lugar.

Action.ImageJ.tmaDearrayer = Desagrupador TMA...
Action.ImageJ.tmaDearrayer.description = Identificar los cilindros y la disposición en cuadrícula de una matriz de tejidos

Action.ImageJ.cellDetection = Detección celular...
Action.ImageJ.cellDetection.description = Detección celular predeterminada de QuPath.\nTenga en cuenta que es un método de uso general, no optimizado para ninguna tinción concreta.\n\nEs imprescindible definir primero el tipo de imagen (p. ej. campo claro o fluorescencia) antes de ejecutar este comando.
Action.ImageJ.positiveCellDetection = Detección de células positivas...
Action.ImageJ.positiveCellDetection.description = Equivalente a 'Detección celular', con parámetros adicionales para definir un umbral durante la detección e identificar células con positividad simple.
Action.ImageJ.cellAndMembraneDetection = Detección de células y membrana...
Action.ImageJ.cellAndMembraneDetection.description = Detección celular que utiliza la información de la membrana para limitar la expansión del límite celular.\n\nSe diseñó específicamente para la tinción con hematoxilina y DAB, y solo funciona cuando la tinción de membrana es muy nítida o está ausente. No se recomienda con carácter general.
Action.ImageJ.subcellularDetection = Detección subcelular (experimental)...
Action.ImageJ.subcellularDetection.description = Identificar estructuras subcelulares (p. ej. puntos de todo tipo) dentro de las células detectadas.

Action.ImageJ.scriptRunner = Ejecutor de scripts de ImageJ
Action.ImageJ.scriptRunner.description = Ejecutar scripts y macros de ImageJ dentro de QuPath.\nExtrae las regiones de imagen correspondientes a los objetos de QuPath y las pasa a ImageJ para su procesamiento.
Action.ImageJ.legacyMacroRunner = Ejecutor de macros de ImageJ (heredado)
Action.ImageJ.legacyMacroRunner.description = Comando anterior para ejecutar macros de ImageJ dentro de QuPath.\nHa sido sustituido a partir de QuPath v0.6.0.
Action.ImageJ.setImageJDirectory = Establecer el directorio local de ImageJ...
Action.ImageJ.setImageJDirectory.description = Establecer el directorio que se usará con la versión de ImageJ integrada en QuPath.\n\nAl definirlo, los plugins de una instalación existente de ImageJ quedan disponibles para la versión integrada en QuPath (siempre que no tengan dependencias incompatibles).

Action.ImageJ.showImageJ = Mostrar ImageJ
Action.ImageJ.showImageJ.description = Mostrar la ventana principal de ImageJ
Action.ImageJ.extractRegion = Enviar región a ImageJ...
Action.ImageJ.extractRegion.description = Extraer la región de imagen seleccionada y enviarla a ImageJ
Action.ImageJ.extractRegionSnapshot = Enviar captura a ImageJ
Action.ImageJ.extractRegionSnapshot.description = Crear una captura renderizada (RGB) y enviarla a ImageJ

Action.ImageJ.importRois = Importar ROI de ImageJ...
Action.ImageJ.importRois.description = Importar ROI de ImageJ desde archivos .roi o .zip, convirtiéndolas en objetos de QuPath


# SVG extension
Extension.SVG = Extensión de exportación SVG
Extension.SVG.description = Exportar capturas e imágenes en formato SVG
Action.SVG.exportImage = SVG renderizado...
Action.SVG.exportImage.description = Exportar la región seleccionada como imagen SVG renderizada (RGB).\nLas anotaciones y las ROI se guardarán como vectores, que después pueden ajustarse en otros programas.
Action.SVG.exportSnapshot = Contenido del visor actual (SVG)...
Action.SVG.exportSnapshot.description = Exportar una captura RGB del contenido del visor actual como imagen SVG.\nLas anotaciones y las ROI se guardarán como vectores, que después pueden ajustarse en otros programas.


# Bio-Formats extension
Extension.BioFormats = Extensión Bio-Formats
Extension.BioFormats.description = Instala la compatibilidad para leer y escribir imágenes usando las opciones de lectura y escritura de Bio-Formats (https://www.openmicroscopy.org/bio-formats/)
Extension.BioFormats.missing.description = ¡No se encuentra la biblioteca Bio-Formats requerida por esta extensión!
Action.BioFormats.exportOmeTif = OME-TIFF...
Action.BioFormats.exportOmeTif.description = Escribir regiones como imágenes OME-TIFF. Admite la escritura de pirámides de imagen.
Action.BioFormats.omeZarr = OME-Zarr...
Action.BioFormats.omeZarrWriter = Escritor OME-Zarr
Action.BioFormats.stopCurrentExport = ¿Desea detener la exportación en curso?
Action.BioFormats.exportOMEZarr = Exportar OME-Zarr
Action.BioFormats.writeOMEZarr = Escribir OME-Zarr
Action.BioFormats.invalidZarrExtension = La extensión del archivo debe ser .ome.zarr
Action.BioFormats.directoryAlreadyExists = El directorio no debe existir previamente
Action.BioFormats.exportingTo = Exportando a {0} -\n¡Mantenga QuPath en ejecución hasta que finalice la exportación!
Action.BioFormats.exportComplete = ¡Exportación de {0} completada!
Action.BioFormats.pyramidalDownsample = Submuestreo piramidal
Action.BioFormats.pyramidalDownsampleDetail = Cantidad de submuestreo de cada nivel piramidal consecutivo; use 1 para indicar que la imagen no debe ser piramidal
Action.BioFormats.tileSize = Tamaño de tesela
Action.BioFormats.tileSizeDetail = Ancho y alto de tesela para la exportación
Action.BioFormats.allZSlices = Todos los cortes z
Action.BioFormats.allZSlicesDetail = Incluir todos los cortes z de la pila. Si no se marca, solo se considera el corte z actual
Action.BioFormats.allTimepoints = Todos los puntos temporales
Action.BioFormats.allTimepointsDetail = Incluir todos los puntos temporales de la serie temporal. Si no se marca, solo se considera el punto temporal actual
Action.BioFormats.numberOfThreads = Número de hilos
Action.BioFormats.numberOfThreadsDetail = Número de hilos que se usarán para la exportación



# Processing extension
Extension.Processing = Extensión de procesamiento y clasificación
Extension.Processing.description = Comandos principales de procesamiento y clasificación

Action.Processing.Spatial.delaunay = Características de agrupamiento de Delaunay 2D...
Action.Processing.Spatial.delaunay.description = Aplicar una triangulación de Delaunay a los objetos de detección según la ubicación de sus centroides.\nAyuda a identificar agrupaciones de objetos vecinos entre sí.\n\nTenga en cuenta que es probable que este comando se sustituya en una versión futura.

Action.Processing.CellDetection.fastCellCounts = Recuento celular rápido (campo claro)...
Action.Processing.CellDetection.fastCellCounts.description = Recuento celular rápido para imágenes con hematoxilina y DAB

Action.Processing.DensityMaps.create = Crear mapa de densidad...
Action.Processing.DensityMaps.create.description = Crear un mapa de densidad para identificar regiones con una alta densidad de detecciones (p. ej. células), opcionalmente con clasificaciones determinadas
Action.Processing.DensityMaps.load = Cargar mapa de densidad
Action.Processing.DensityMaps.load.description = Cargar un mapa de densidad generado previamente con 'Crear mapa de densidad'

Action.Processing.Classify.loadPixelClassifier = Cargar clasificador de píxeles...
Action.Processing.Classify.loadPixelClassifier.description = Cargar un clasificador de píxeles existente.\nPuede usarse para aplicar el clasificador a imágenes nuevas, pero no para continuar el entrenamiento.
Action.Processing.Classify.trainPixelClassifier = Entrenar clasificador de píxeles...
Action.Processing.Classify.trainPixelClassifier.description = Entrenar un clasificador de píxeles.\nPuede usarse para cuantificar áreas, o para generar o clasificar objetos.
Action.Processing.Classify.createThresholder = Crear umbralizador...
Action.Processing.Classify.createThresholder.description = Crear un clasificador de píxeles sencillo que aplica un umbral fijo a una imagen

Action.Processing.Classify.loadObjectClassifier = Cargar clasificador de objetos...
Action.Processing.Classify.loadObjectClassifier.description = Cargar un clasificador de objetos existente.\nPuede usarse para aplicar el clasificador a objetos nuevos, pero no para continuar el entrenamiento.
Action.Processing.Classify.trainObjectClassifier = Entrenar clasificador de objetos...
Action.Processing.Classify.trainObjectClassifier.description = Entrenar interactivamente un clasificador de objetos mediante aprendizaje automático.\nResulta útil cuando los objetos no pueden clasificarse a partir de una sola medición.
Action.Processing.Classify.createSingleMeasurementClassifier = Crear clasificador de medición única...
Action.Processing.Classify.createSingleMeasurementClassifier.description = Crear un clasificador de objetos sencillo que aplica un umbral a una sola medición
Action.Processing.Classify.createCompositeClassifier = Crear clasificador compuesto...
Action.Processing.Classify.createCompositeClassifier.description = Combinar varios clasificadores para crear un único clasificador aplicándolos de forma secuencial
Action.Processing.Classify.setCellIntensityClassifications = Establecer clasificaciones de intensidad celular...
Action.Processing.Classify.setCellIntensityClassifications.description = Establecer las clasificaciones de intensidad celular a partir de una sola medición.\nResulta útil para calcular densidades o porcentajes de células positivas, o índices H-score.

Action.Processing.Classify.createRegionAnnotations = Crear anotaciones de región...
Action.Processing.Classify.createRegionAnnotations.description = Crear anotaciones de regiones de tamaño fijo.\nPuede usarse para seleccionar regiones representativas de varias imágenes con las que entrenar un clasificador (normalmente de píxeles), en combinación con 'Crear imagen de entrenamiento'.
Action.Processing.Classify.createTrainingImage = Crear imagen de entrenamiento...
Action.Processing.Classify.createTrainingImage.description = Crear una imagen compuesta por regiones extraídas de varias imágenes de un proyecto.\nPuede resultar útil para entrenar interactivamente un clasificador sobre un conjunto de datos variado.
Action.Processing.Classify.createChannelTrainingImages = Crear imágenes de entrenamiento por canal duplicado...
Action.Processing.Classify.createChannelTrainingImages.description = Duplicar una imagen de un proyecto de modo que haya un duplicado por cada canal de la imagen.\n\nPuede usarse para entrenar clasificadores independientes para distintos canales de imágenes multiplexadas, que después se fusionan para formar un clasificador compuesto.
Action.Processing.Classify.splitTrainValidationTest = Dividir el proyecto en entrenamiento/validación/prueba...
Action.Processing.Classify.splitTrainValidationTest.description = Dividir las imágenes de un proyecto en conjuntos de entrenamiento, validación y prueba


# Simple image viewer
SimpleImageViewer.Action.close = Cerrar
SimpleImageViewer.Action.close.description = Cerrar la ventana de la imagen
SimpleImageViewer.Action.copy = Copiar
SimpleImageViewer.Action.copy.description = Copiar la imagen al portapapeles
SimpleImageViewer.Action.save = Guardar como
SimpleImageViewer.Action.save.description = Guardar la imagen
SimpleImageViewer.Action.saturation = Establecer saturación
SimpleImageViewer.Action.saturation.description = Establecer la saturación para mejorar el contraste en imágenes que no son de 8 bits
SimpleImageViewer.Action.expandToWindow = Ajustar a la ventana
SimpleImageViewer.Action.expandToWindow.description = Permitir que la imagen crezca hasta ajustarse a la ventana. En caso contrario, la imagen no superará su tamaño preferido.
SimpleImageViewer.placeholderText = No hay ninguna imagen disponible
SimpleImageViewer.noImage = Sin imagen
SimpleImageViewer.noTitle = Imagen sin título


# Preferences
Prefs.Appearance = Apariencia
Prefs.General = General
Prefs.Undo = Deshacer/Rehacer
Prefs.Drawing = Herramientas de dibujo
Prefs.InputOutput = Entrada/Salida
Prefs.Locale = Idioma y región
Prefs.Measurements = Tablas de mediciones
Prefs.Scripting = Scripts
Prefs.Extensions = Extensiones
Prefs.Objects = Objetos
Prefs.Viewer = Visor
Prefs.BioFormats = Bio-Formats

Prefs.Appearance.theme = Tema
Prefs.Appearance.theme.description = Tema de la interfaz de usuario de QuPath.
Prefs.Appearance.badges = Mostrar distintivos en la barra de herramientas
Prefs.Appearance.badges.description = Incluir distintivos en los botones de la barra de herramientas, por ejemplo para avisos o errores.
Prefs.Appearance.font = Fuente
Prefs.Appearance.font.description = Fuente principal de la interfaz de usuario de QuPath.
Prefs.Appearance.systemMenubar = Usar la barra de menús del sistema
Prefs.Appearance.systemMenubar.description = Usar la barra de menús del sistema en lugar de barras de menús propias de la aplicación (el valor predeterminado es activado).

Prefs.General.showStartupMessage = Mostrar mensaje de bienvenida
Prefs.General.showStartupMessage.description = Mostrar el mensaje de bienvenida con enlaces a la documentación, el foro y el código cada vez que se inicia QuPath.\nPuede acceder a este mensaje en cualquier momento desde el menú 'Ayuda'.
Prefs.General.showLicenseMessage = Mostrar mensaje de licencia
Prefs.General.showLicenseMessage.description = Mostrar un mensaje sobre la licencia y el uso al iniciar QuPath.
Prefs.General.startupScriptPath = Ruta del script de inicio
Prefs.General.startupScriptPath.description = Seleccionar opcionalmente un archivo de script Groovy que se ejecutará inmediatamente después de iniciar QuPath.
Prefs.General.checkForUpdates = Buscar actualizaciones al iniciar
Prefs.General.checkForUpdates.description = Buscar actualizaciones automáticamente al iniciar QuPath y mostrar un mensaje si hay una versión nueva disponible.
Prefs.General.showImageNameInTitle = Mostrar el nombre de la imagen en el título de la ventana
Prefs.General.showImageNameInTitle.description = Mostrar el nombre de la imagen actual en la barra de título principal de QuPath (desactívelo si el nombre no debe verse).
Prefs.General.maskImageNames = Ocultar los nombres de imagen en los proyectos
Prefs.General.maskImageNames.description = Ocultar los nombres de las imágenes al usar proyectos, para ayudar a reducir el posible sesgo del usuario durante el análisis.
Prefs.General.skipProjectUriChecks = Omitir la comprobación de archivos en los proyectos
Prefs.General.skipProjectUriChecks.description = Evitar comprobar la existencia de los archivos en el navegador de proyectos. Puede ayudar cuando el navegador de proyectos va lento por la latencia de red.
Prefs.General.maxMemory = Establecer memoria máxima %
Prefs.General.maxMemory.description = Establecer la memoria máxima para Java como porcentaje de la memoria disponible (rango permitido 10-90%).\nTenga en cuenta que algunos comandos (p. ej. la clasificación de píxeles) pueden usar más memoria cuando sea necesario,\npor lo que el valor predeterminado de 50% se recomienda para la mayoría de los sistemas.
Prefs.General.tileCache = Porcentaje de memoria para la caché de teselas
Prefs.General.tileCache.description = Porcentaje de la memoria máxima que se usará para almacenar en caché las teselas de imagen (debe ser >10% y <90%; el valor sugerido es 25%).\nUn valor alto puede mejorar el rendimiento (especialmente en imágenes multicanal), pero aumenta el riesgo de errores por falta de memoria.\nLos cambios se aplican al reiniciar QuPath.
Prefs.General.logFiles = Crear archivos de registro
Prefs.General.logFiles.description = Crear archivos de registro al usar QuPath dentro del directorio de usuario de QuPath (útil para depurar y notificar errores).
Prefs.General.showExperimental = Mostrar comandos experimentales
Prefs.General.showExperimental.description = Incluir comandos experimentales en los menús: es probable que tengan errores y estén incompletos, pero pueden resultar útiles en ocasiones.
Prefs.General.showTMA = Mostrar comandos TMA
Prefs.General.showTMA.description = Incluir los elementos de menú relacionados con matrices de tejidos (TMA).
Prefs.General.showDeprecated = Mostrar comandos obsoletos
Prefs.General.showDeprecated.description = Incluir los elementos de menú relacionados con comandos heredados (ya no destinados a usarse).
Prefs.General.hierarchyDisplay = Visualización de detecciones en la jerarquía
Prefs.General.hierarchyDisplay.description = Elegir cómo mostrar las detecciones en la vista de árbol de la jerarquía: elija 'None' para obtener el mejor rendimiento.
Prefs.General.logLevel = Nivel de registro
Prefs.General.logLevel.description = Nivel de registro, que determina el número de mensajes registrados.\nSe recomienda usar solo INFO o DEBUG; un registro más frecuente (p. ej. TRACE, ALL) probablemente cause problemas de rendimiento.
Prefs.General.numThreads = Número de hilos paralelos
Prefs.General.numThreads.description = Establecer el límite de procesadores que se usarán para la paralelización.\nDebe ser > 0 y <= los procesadores disponibles en el equipo.\nSi queda fuera de ese rango, se usarán los procesadores disponibles.\nNormalmente el valor predeterminado es adecuado, pero puede ayudar reducirlo si aparecen errores por falta de memoria.
Prefs.General.imageType = Establecer el tipo de imagen
Prefs.General.imageType.description = Estimar y establecer automáticamente el tipo de imagen al abrirla por primera vez (p. ej. H&E, H-DAB, fluorescencia), preguntar o dejarlo sin definir.\nLa estimación resulta cómoda, pero tenga en cuenta que no siempre es correcta: ¡compruébelo siempre!\nEl tipo de imagen influye en algunos comandos disponibles, por ejemplo en cómo se separan las tinciones para la visualización o para las detecciones celulares.
Prefs.General.commandBar = Modo de la barra de comandos
Prefs.General.commandBar.description = Modo usado para mostrar el campo de búsqueda de comandos sobre el visor.

Prefs.Drawing.returnToMove = Volver automáticamente a la herramienta Mover
Prefs.Drawing.returnToMove.description = Volver automáticamente a la herramienta 'Mover' después de dibujar una ROI (se aplica a todas las herramientas de dibujo excepto el pincel y la varita).
Prefs.Drawing.pixelSnapping = Usar ajuste a píxeles
Prefs.Drawing.pixelSnapping.description = Ajustar automáticamente los píxeles a coordenadas enteras al usar las herramientas de dibujo (algunas herramientas, p. ej. línea o puntos, pueden ignorarlo).
Prefs.Drawing.clipROIsForHierarchy = Recortar las ROI según la jerarquía
Prefs.Drawing.clipROIsForHierarchy.description = Recortar automáticamente las ROI para que no se extiendan más allá de una anotación padre ni invadan una anotación hija: esto ayuda a mantener la jerarquía más fácil de interpretar, sin solapamientos.\nEl ajuste puede omitirse pulsando la tecla 'Mayús'.
Prefs.Drawing.brushDiameter = Diámetro del pincel
Prefs.Drawing.brushDiameter.description = Establecer el diámetro predeterminado del pincel.
Prefs.Drawing.tileBrush = Usar pincel de teselas
Prefs.Drawing.tileBrush.description = Adaptar la herramienta de pincel para seleccionar teselas, cuando estén disponibles.
Prefs.Drawing.brushScaleByMag = Escalar el pincel según la magnificación
Prefs.Drawing.brushScaleByMag.description = Adaptar el tamaño del pincel a la magnificación, de modo que a mayor magnificación el pincel sea más fino.
Prefs.Drawing.useMultipoint = Usar la herramienta multipunto
Prefs.Drawing.useMultipoint.description = Con la herramienta de recuento, añadir puntos a un objeto existente cuando sea posible.\nLa alternativa es crear un punto nuevo con cada clic.
Prefs.Drawing.pointRadius = Radio de los puntos
Prefs.Drawing.pointRadius.description = Establecer el radio predeterminado de los puntos mostrados en el visor.

Prefs.Drawing.wandType = Tipo de color de la varita
Prefs.Drawing.wandType.description = Especificar el espacio de color al usar la varita; si se elige 'gray', la varita usa la 'oscuridad' sin tener en cuenta el color concreto
Prefs.Drawing.wandSigma = Suavizado de la varita
Prefs.Drawing.wandSigma.description = Establecer el suavizado que usa la herramienta de varita: los valores más altos generan regiones mayores y más suaves (predeterminado = 4.0)
Prefs.Drawing.wandSensivity = Sensibilidad de la varita
Prefs.Drawing.wandSensivity.description = Establecer la sensibilidad de la herramienta de varita: los valores más bajos hacen que preste menos atención a las intensidades locales y se comporte más como el pincel (predeterminado = 2.0)
Prefs.Drawing.wandUseOverlays = La varita usa las superposiciones
Prefs.Drawing.wandUseOverlays.description = Usar la información de las superposiciones de imagen para influir en las regiones creadas con la herramienta de varita

Prefs.InputOutput.minPyramidDimension = Dimensión mínima de imagen para piramidalizar
Prefs.InputOutput.minPyramidDimension.description = Permitir calcular una pirámide de imagen para una imagen de resolución única si su ancho o su alto superan este tamaño.
Prefs.InputOutput.tmaExportDownsample = Factor de submuestreo para exportar TMA
Prefs.InputOutput.tmaExportDownsample.description = Cantidad de submuestreo aplicada a las imágenes de los cilindros TMA al exportarlas; un submuestreo mayor produce imágenes más pequeñas.\nElegir 1 exporta los cilindros a resolución completa (lo que puede resultar lento).

Prefs.Locale.default = Idioma principal
Prefs.Locale.default.description = Configuración regional predeterminada global; cambiarla puede actualizar tanto la configuración de presentación como la de formato.\nSe recomienda *encarecidamente* usar inglés (Estados Unidos) para mantener un formato coherente, especialmente en los \nnúmeros decimales (usando . como separador decimal).\n\nPuede restablecer la configuración regional haciendo doble clic en el menú desplegable.
Prefs.Locale.display = Interfaz de usuario
Prefs.Locale.display.description = Configuración regional usada para los mensajes de la interfaz.\nSe recomienda usar inglés (Estados Unidos) para mantener un formato coherente.\nOtros idiomas *pueden* estar disponibles si se ha añadido compatibilidad lingüística adicional.
Prefs.Locale.format = Fechas y números
Prefs.Locale.format.description = Configuración regional usada para dar formato a fechas, números, etc.\nSe recomienda *encarecidamente* usar inglés (Estados Unidos) para mantener un formato coherente, especialmente en los \nnúmeros decimales (usando . como separador decimal).\n\nPuede restablecer la configuración regional haciendo doble clic en el menú desplegable.

Prefs.Measurements.thumbnails = Incluir miniaturas
Prefs.Measurements.thumbnails.description = Mostrar de forma predeterminada imágenes en miniatura para cada objeto en una tabla de mediciones.
Prefs.Measurements.ids = Incluir identificadores de objeto
Prefs.Measurements.ids.description = Mostrar de forma predeterminada la columna con el identificador de objeto en una tabla de mediciones.

Prefs.Undo.maxUndoLevels = Número máximo de niveles de deshacer
Prefs.Undo.maxUndoLevels.description = Número máximo de niveles de 'deshacer' admitidos.
Prefs.Undo.maxUndoHierarchySize = Tamaño máximo de jerarquía para deshacer
Prefs.Undo.maxUndoHierarchySize.description = Número máximo de objetos en la jerarquía antes de que 'deshacer' se desactive (por motivos de rendimiento).

Prefs.Scripting.scriptsPath = Directorio de scripts
Prefs.Scripting.scriptsPath.description = Ruta a un directorio que contiene los scripts que deben estar disponibles en los menús de QuPath.

Prefs.Extensions.userPath = Directorio de usuario de QuPath
Prefs.Extensions.userPath.description = Ruta al directorio de usuario de QuPath, que puede contener scripts, registros y extensiones.\nReinicie QuPath después de definirla.

Prefs.Objects.clipboard = Número máximo de objetos en el portapapeles
Prefs.Objects.clipboard.description = Número máximo de objetos que pueden copiarse al portapapeles del sistema.\nIntentar copiar demasiados puede fallar o bloquear QuPath.\nSi necesita más objetos, es mejor exportarlos como GeoJSON e importarlos después.
Prefs.Objects.annotationLineThickness = Grosor de línea de las anotaciones
Prefs.Objects.annotationLineThickness.description = Grosor (en píxeles de pantalla) del contorno de los objetos de anotación y de los cilindros TMA (predeterminado = 2)
Prefs.Objects.detectionLineThickness = Grosor de línea de las detecciones
Prefs.Objects.detectionLineThickness.description = Grosor (en píxeles de imagen) del contorno de los objetos de detección (predeterminado = 2)
Prefs.Objects.newDetectionRendering = Ajustar el grosor de línea de las detecciones con el zoom
Prefs.Objects.newDetectionRendering.description = Dibujar los objetos de detección con un grosor de trazo que se escala con el nivel de zoom a alta magnificación (novedad en la v0.6.0)
Prefs.Objects.useSelectedColor = Usar color de selección
Prefs.Objects.useSelectedColor.description = Resaltar los objetos seleccionados recoloreándolos; en caso contrario, se usará un grosor de línea ligeramente mayor
Prefs.Objects.selectedColor = Color del objeto seleccionado
Prefs.Objects.selectedColor.description = Establecer el color usado para resaltar el objeto seleccionado, si 'Usar color de selección' está activado
Prefs.Objects.defaultColor = Color de objeto predeterminado
Prefs.Objects.defaultColor.description = Establecer el color predeterminado para los objetos que no tienen un color de clasificación definido
Prefs.Objects.tmaCoreColor = Color de los cilindros TMA
Prefs.Objects.tmaCoreColor.description = Establecer el color predeterminado de los objetos de cilindro TMA
Prefs.Objects.tmaCoreMissingOpacity = Opacidad de los cilindros TMA ausentes
Prefs.Objects.tmaCoreMissingOpacity.description = Establecer la opacidad usada al dibujar los objetos de cilindro TMA ausentes

Prefs.Viewer.placeholderText = Mostrar texto de marcador de posición en el visor
Prefs.Viewer.placeholderText.description = Mostrar texto de marcador de posición en el visor siempre que esté vacío
Prefs.Viewer.backgroundColor = Color de fondo del visor
Prefs.Viewer.backgroundColor.description = Establecer el color que se muestra detrás de cualquier imagen en el visor (es decir, más allá de los límites de la imagen).
Prefs.Viewer.alwaysPaintSelected = Dibujar siempre los objetos seleccionados
Prefs.Viewer.alwaysPaintSelected.description = Dibujar siempre los objetos seleccionados, aunque la opacidad de la superposición sea 0
Prefs.Viewer.keepDisplaySettings = Mantener la configuración de canales
Prefs.Viewer.keepDisplaySettings.description = Mantener la configuración de visualización de canales (colores de canal, brillo/contraste) al abrir imágenes similares
Prefs.Viewer.interpolateBilinear = Usar interpolación bilineal
Prefs.Viewer.interpolateBilinear.description = Usar interpolación bilineal para mostrar la imagen en el visor (el valor predeterminado es vecino más próximo).
Prefs.Viewer.autoSaturationPercent = Saturación % del brillo/contraste automático
Prefs.Viewer.autoSaturationPercent.description = Establecer el % de píxeles claros y el % de píxeles oscuros que deben saturarse al aplicar la configuración 'automática' de brillo/contraste.
Prefs.Viewer.invertZSlider = Invertir el control de posición z
Prefs.Viewer.invertZSlider.description = Invertir el control deslizante vertical usado para desplazarse entre cortes z (útil para quienes la orientación predeterminada les resulte poco intuitiva).
Prefs.Viewer.scrollSpeed = Velocidad de desplazamiento %
Prefs.Viewer.scrollSpeed.description = Ajustar la velocidad de desplazamiento: 100% es la velocidad 'normal', mientras que los valores más bajos producen un desplazamiento más lento
Prefs.Viewer.navigationSpeed = Velocidad de navegación %
Prefs.Viewer.navigationSpeed.description = Ajustar la velocidad de navegación: 100% es la velocidad 'normal', mientras que los valores más bajos producen una navegación más lenta

Prefs.Viewer.navigationAcceleration = Usar aceleración de navegación
Prefs.Viewer.navigationAcceleration.description = Aplicar efectos de aceleración y desaceleración al mantener pulsada y soltar una tecla de navegación.
Prefs.Viewer.skipMissingCores = Omitir los cilindros TMA ausentes
Prefs.Viewer.skipMissingCores.description = Salta los cilindros TMA ausentes al navegar por las cuadrículas TMA con las teclas de flecha.
Prefs.Viewer.iseScrollGestures = Usar gestos táctiles de desplazamiento
Prefs.Viewer.iseScrollGestures.description = Usar gestos de desplazamiento con pantallas táctiles o paneles táctiles para navegar por la preparación.
Prefs.Viewer.invertScrolling = Invertir el desplazamiento
