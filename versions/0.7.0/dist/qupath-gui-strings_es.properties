# Support for context help

ContextHelp.title = Ayuda contextual
ContextHelp.defaultHelpText = Sitúe el cursor sobre un elemento para ver el texto de ayuda disponible
ContextHelp.warning.maskImageNames = Los nombres de las imágenes están ocultos actualmente. \nPuede cambiarlo haciendo clic derecho en el panel de proyecto y seleccionando "Ocultar nombres de imagen". 
ContextHelp.warning.selectionMode = El modo de selección está activo: las herramientas de dibujo pasarán a funcionar como herramientas de selección
ContextHelp.warning.hiddenObjectsPredicate = Las opciones de superposición están configuradas para ocultar objetos según un predicado
ContextHelp.warning.annotationsHidden = Las anotaciones están ocultas
ContextHelp.warning.detectionsHidden = Las detecciones están ocultas
ContextHelp.warning.classificationsHidden = Puede haber objetos ocultos según su clasificación.\nPuede cambiarlo en la lista 'Clasificaciones', dentro de la pestaña 'Anotaciones'.
ContextHelp.warning.tmaCoresHidden = La cuadrícula TMA está oculta
ContextHelp.warning.pixelOverlayHidden = La superposición de clasificación de píxeles está oculta
ContextHelp.warning.opacityZero = El control de opacidad está muy bajo (los objetos no seleccionados no serán visibles)
ContextHelp.warning.noImage = No hay ninguna imagen abierta en el visor actual
ContextHelp.warning.noProject = No hay ningún proyecto abierto (QuPath funciona mejor con proyectos)
ContextHelp.warning.gamma = El valor de gamma no es 1.0. Esto afecta a cómo se muestra la imagen.\nCambie la gamma en el cuadro de diálogo de brillo/contraste.
ContextHelp.warning.invertedBackground = La imagen se muestra con el fondo invertido.\nCambie esta opción en el cuadro de diálogo de brillo/contraste.
ContextHelp.warning.greyscale = La imagen se muestra en escala de grises, lo que solo permite ver un canal a la vez.\nCambie el canal visualizado o desactive "Mostrar escala de grises" en el cuadro de diálogo de brillo/contraste.
ContextHelp.warning.noChannels = ¡No hay ningún canal seleccionado!\nUse el comando 'Brillo/Contraste' para seleccionar canales.
ContextHelp.warning.colorsSimilar = Al menos un color de clasificación es similar al color de objeto predeterminado.\nSerá difícil distinguir si los objetos están clasificados.
ContextHelp.warning.unseenErrors = Hay errores registrados que todavía no se han consultado.\nRevise el registro para ver los detalles.
ContextHelp.warning.pixelSizeMissing = No se ha definido el tamaño de píxel.\nEs necesario para algunos comandos y puede definirse en la pestaña 'Imagen'.
ContextHelp.warning.pixelSizeDpi = El valor del tamaño de píxel resulta sospechoso.\nParece un valor de resolución en puntos por pulgada, lo que podría ser incorrecto.
ContextHelp.warning.imageTypeMissing = No se ha definido el tipo de imagen.\nEs necesario para algunos comandos y puede definirse en la pestaña 'Imagen'.
ContextHelp.warning.largeNonPyramidalImage = La imagen es grande pero no es piramidal (es decir, multirresolución).\nEsto puede causar problemas de rendimiento que se solucionan creando una imagen piramidal.

