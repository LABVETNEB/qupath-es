Toolbar.magnification.description = Magnificación mostrada: haga doble clic para editarla
Toolbar.setMagnification = Establecer magnificación
Toolbar.setDownsample = Establecer factor de submuestreo

Toolbar.magnificationScale.description = Valor de escala mostrado: haga doble clic para editarlo
Toolbar.showMeasurementsTable.description = Mostrar la tabla de mediciones
Toolbar.viewerMenu.description = Opciones para mostrar u ocultar elementos del visor de QuPath, y otras ventanas auxiliares

Toolbar.message.promptMagnification = Introduzca la magnificación
Toolbar.message.invalidMagnification = Magnificación no válida %s.\nUse un valor mayor que 0.
Toolbar.message.promptDownsample = Introduzca el factor de submuestreo
Toolbar.message.invalidDownsample = Factor de submuestreo no válido %s.\nUse un valor mayor que 0.


# Commands that work on viewer overlays

OverlayActions.showCountingGrid = Mostrar cuadrícula
OverlayActions.showCountingGrid.description = Mostrar u ocultar la superposición de la cuadrícula de recuento
OverlayActions.setCountingGridSpacing = Establecer espaciado de cuadrícula
OverlayActions.setCountingGridSpacing.description = Establecer el espaciado de la cuadrícula de recuento
OverlayActions.showPixelOverlay = Mostrar clasificación de píxeles
OverlayActions.showPixelOverlay.description = Mostrar u ocultar la superposición de píxeles (usada para la clasificación de píxeles)
OverlayActions.showAnnotations = Mostrar anotaciones
OverlayActions.showAnnotations.description = Mostrar u ocultar los objetos de anotación
OverlayActions.showAnnotationNames = Mostrar nombres de anotación
OverlayActions.showAnnotationNames.description = Mostrar u ocultar los nombres de las anotaciones (cuando estén disponibles)
OverlayActions.fillAnnotations = Rellenar anotaciones
OverlayActions.fillAnnotations.description = Rellenar o no las ROI de los objetos de anotación al mostrarlos
OverlayActions.showDetections = Mostrar detecciones
OverlayActions.showDetections.description = Mostrar u ocultar los objetos de detección
OverlayActions.fillDetections = Rellenar detecciones
OverlayActions.fillDetections.description = Rellenar o no las ROI de los objetos de detección al mostrarlos
OverlayActions.showTMAGrid = Mostrar cuadrícula TMA
OverlayActions.showTMAGrid.description = Mostrar u ocultar la cuadrícula de la matriz de tejidos (cuando esté disponible)
OverlayActions.showTMALabels = Mostrar etiquetas de la cuadrícula TMA
OverlayActions.showTMALabels.description = Mostrar u ocultar las etiquetas de los cilindros de la matriz de tejidos (cuando estén disponibles)
OverlayActions.showConnections = Mostrar conexiones entre objetos
OverlayActions.showConnections.description = Mostrar las conexiones entre objetos, si están disponibles.\nEsto puede usarse junto con algunos comandos espaciales, por ejemplo para mostrar una triangulación de Delaunay como superposición.

OverlayActions.showCellBoundaries = Solo límites celulares
OverlayActions.showCellBoundaries.description = Mostrar las células dibujando únicamente la ROI del límite celular
OverlayActions.showCellNuclei = Solo núcleos
OverlayActions.showCellNuclei.description = Mostrar las células dibujando únicamente las ROI de los núcleos celulares
OverlayActions.showCellBoth = Núcleos y límites celulares
OverlayActions.showCellBoth.description = Mostrar las células dibujando tanto la ROI del límite celular como la del núcleo, cuando estén disponibles
OverlayActions.showCellCentroids = Solo centroides celulares
OverlayActions.showCellCentroids.description = Mostrar las células dibujando únicamente los centroides celulares.\nLa forma y el color dependerán de la clasificación.

# Commands that work on viewers

ViewerActions.overview = Mostrar vista general de la preparación
ViewerActions.overview.description = Mostrar u ocultar la imagen de vista general del visor. Es una miniatura en la que se puede hacer clic para navegar.
ViewerActions.location = Mostrar posición del cursor
ViewerActions.location.description = Mostrar u ocultar el texto con la posición del cursor
ViewerActions.scalebar = Mostrar barra de escala
ViewerActions.scalebar.description = Mostrar u ocultar la barra de escala del visor
ViewerActions.zProject = Mostrar superposición de proyección Z
ViewerActions.zProject.description = Mostrar u ocultar los controles para ver proyecciones de pilas z.
ViewerActions.synchronize = Sincronizar visores
ViewerActions.synchronize.description = Sincronizar el desplazamiento y el zoom al trabajar con imágenes abiertas en varios visores
ViewerActions.matchResolutions = Igualar resoluciones de los visores
ViewerActions.matchResolutions.description = Ajustar los factores de zoom para igualar las resoluciones de las imágenes abiertas en varios visores
ViewerActions.detachViewer = Desacoplar el visor de la cuadrícula
ViewerActions.detachViewer.description = Desacoplar el visor seleccionado de la cuadrícula de visores, en su propia ventana
ViewerActions.attachViewer = Acoplar el visor a la cuadrícula
ViewerActions.attachViewer.description = Devolver el visor desacoplado a la cuadrícula de visores (si hay espacio para él)
ViewerActions.zoomToFit = Ajustar zoom a la ventana
ViewerActions.zoomToFit.description = Ajustar el zoom de todas las imágenes para que la imagen completa quepa en el visor
ViewerActions.grid1x1 = Cuadrícula 1 x 1 (visor único)
ViewerActions.grid1x1.description = Configurar la cuadrícula para que contenga un solo visor
ViewerActions.grid2x1 = Cuadrícula 2 x 1 (vertical)
ViewerActions.grid2x1.description = Configurar la cuadrícula para que contenga 2 visores dispuestos verticalmente
ViewerActions.grid1x2 = Cuadrícula 1 x 2 (horizontal)
ViewerActions.grid1x2.description = Configurar la cuadrícula para que contenga 2 visores dispuestos horizontalmente
ViewerActions.grid2x2 = Cuadrícula 2 x 2
ViewerActions.grid2x2.description = Configurar la cuadrícula para que contenga 4 visores dispuestos en una cuadrícula de 2x2
ViewerActions.grid3x3 = Cuadrícula 3 x 3
ViewerActions.grid3x3.description = Configurar la cuadrícula para que contenga 9 visores dispuestos en una cuadrícula de 3x3

# Shared commands for a QuPath instance
CommonActions.objectDescriptions = Mostrar descripciones de objetos
CommonActions.objectDescriptions.description = Mostrar las descripciones del objeto seleccionado, cuando estén disponibles.\nLas descripciones pueden ser texto plano, markdown o html añadidos como propiedad 'description' de un objeto (actualmente solo se admiten anotaciones).
CommonActions.measureTMA = Mostrar mediciones TMA
CommonActions.measureTMA.description = Mostrar una tabla de mediciones para los cilindros de la matriz de tejidos (TMA)
CommonActions.measureAnnotations = Mostrar mediciones de anotaciones
CommonActions.measureAnnotations.description = Mostrar una tabla de mediciones para los objetos de anotación
CommonActions.measureDetections = Mostrar mediciones de detecciones
CommonActions.measureDetections.description = Mostrar una tabla de mediciones para los objetos de detección
CommonActions.gridViewTMA = Mostrar vista de cuadrícula de cilindros TMA
CommonActions.gridViewTMA.description = Mostrar las mediciones de los cilindros de la matriz de tejidos (TMA) en una vista de cuadrícula
CommonActions.gridViewAnnotations = Mostrar vista de cuadrícula de anotaciones
CommonActions.gridViewAnnotations.description = Mostrar las mediciones de las anotaciones en una vista de cuadrícula
CommonActions.showAnalysisPane = Mostrar panel de análisis
CommonActions.showAnalysisPane.description = Mostrar el panel de análisis.\nContiene las pestañas principales para gestionar proyectos, imágenes y objetos.
CommonActions.showHelp = Mostrar ayuda interactiva
CommonActions.showHelp.description = Mostrar información de ayuda interactiva según la posición del cursor y el estado actual de QuPath
CommonActions.showLog = Mostrar registro
CommonActions.showLog.description = Mostrar el registro.\nEs muy útil para identificar y depurar errores.\nSi desea notificar un problema con QuPath, revise el registro para aportar la información pertinente.
CommonActions.showPrefPane = Preferencias...
CommonActions.showPrefPane.description = Configurar las preferencias para personalizar la apariencia y el comportamiento de QuPath
CommonActions.showBrightnessContrast = Brillo/Contraste
CommonActions.showBrightnessContrast.description = Mostrar el cuadro de diálogo de brillo y contraste.\nTambién se usa para ajustar canales y colores.\nPermite cambiar cómo se muestra la imagen, pero no modifica la imagen en sí.
CommonActions.showCountingTool = Herramienta de recuento
CommonActions.showCountingTool.description = Mostrar el panel de recuento.\nSe utiliza al anotar con la herramienta 'Puntos'.
CommonActions.showPointConvexHull = Mostrar envolvente convexa de puntos
CommonActions.showPointConvexHull.description = Mostrar la envolvente convexa de las anotaciones de puntos.\nAyuda a identificar la región que contiene los puntos y a encontrar puntos en lugares inesperados.
CommonActions.addTMANote = Añadir nota TMA
CommonActions.addTMANote.description = Añadir una nota a un cilindro seleccionado de la matriz de tejidos (TMA).


# File menu
Menu.File = Archivo
Menu.File.Project = Proyecto
Menu.File.ExportImage = Exportar imágenes...
Menu.File.ExportSnapshot = Exportar captura...
Menu.File.TMA = Datos TMA

Action.File.Project.createProject = Crear proyecto...
Action.File.Project.createProject.description = Crear un proyecto nuevo.\nNormalmente es más sencillo arrastrar una carpeta vacía sobre QuPath para crear un proyecto que navegar por estos menús.
Action.File.Project.openProject = Abrir proyecto...
Action.File.Project.openProject.description = Abrir un proyecto existente.\nNormalmente es más sencillo arrastrar la carpeta del proyecto sobre QuPath para abrirlo que usar este comando.
Action.File.Project.closeProject = Cerrar proyecto
Action.File.Project.closeProject.description = Cerrar el proyecto actual, incluidas todas las imágenes abiertas.
Action.File.Project.addImages = Añadir imágenes...
Action.File.Project.addImages.description = Añadir imágenes al proyecto actual.\nTambién puede añadir imágenes arrastrando archivos sobre la ventana principal de QuPath.
Action.File.Project.exportImageList = Exportar lista de imágenes...
Action.File.Project.exportImageList.description = Exportar una lista con las rutas de las imágenes del proyecto actual.
Action.File.Project.editMetadata = Editar metadatos del proyecto...
Action.File.Project.editMetadata.description = Editar los metadatos del proyecto actual.\nAñadiendo propiedades clave-valor a las imágenes, estas pueden ordenarse y consultarse más fácilmente.
Action.File.Project.checkUris = Comprobar los URI del proyecto
Action.File.Project.checkUris.description = Comprobar los 'Identificadores Uniformes de Recursos' (URI) de las imágenes del proyecto actual.\nEsto ayuda a corregir la situación cuando los archivos se han movido y las imágenes ya no se encuentran.
Action.File.Project.importLegacy = Importar imágenes de la v0.1.2...
Action.File.Project.importLegacy.description = Importar imágenes de un proyecto antiguo (QuPath v0.1.2 o anterior).\nTenga en cuenta que en general no es buena idea mezclar versiones de QuPath para el análisis, pero esto puede ayudar a recuperar datos y anotaciones antiguos.\n\nLas imágenes originales deberán estar disponibles, con las rutas correctamente definidas en el archivo de proyecto.

Action.File.TMA.importMap = Importar mapa TMA...
Action.File.TMA.importMap.description = Importar un mapa TMA, por ejemplo una cuadrícula con valores de 'Case ID' para cada cilindro
Action.File.TMA.exportData = Exportar datos TMA...
Action.File.TMA.exportData.description = Exportar los datos TMA de la imagen actual, en un formato compatible con el 'visor de datos TMA'
Action.File.TMA.dataViewer = Abrir el visor de datos TMA
Action.File.TMA.dataViewer.description = Abrir el 'visor de datos TMA' para visualizar datos de cilindros TMA exportados previamente

Action.File.ExportImage.original = Píxeles originales...
Action.File.ExportImage.original.description = Exportar una región de la imagen, extrayendo los píxeles de la imagen original
Action.File.ExportImage.rendered = RGB renderizado (con superposiciones)...
Action.File.ExportImage.rendered.description = Exportar una región de la imagen como imagen RGB, tal y como se muestra en el visor

Action.File.ExportSnapshot.windowScreenshot = Captura de la ventana principal...
Action.File.ExportSnapshot.windowScreenshot.description = Exportar al portapapeles el área de la pantalla correspondiente a la ventana principal de QuPath.\nIncluye cualquier ventana o cuadro de diálogo superpuesto.
Action.File.ExportSnapshot.windowContent = Contenido de la ventana principal...
Action.File.ExportSnapshot.windowContent.description = Exportar al portapapeles el contenido de la ventana principal de QuPath.\nIgnora cualquier ventana o cuadro de diálogo superpuesto.
Action.File.ExportSnapshot.viewerContent = Contenido del visor actual...
Action.File.ExportSnapshot.viewerContent.description = Exportar al portapapeles el contenido del visor actual.\nTenga en cuenta que se crea una imagen RGB, que no contiene necesariamente los valores de píxel originales.

Action.File.open = Abrir...
Action.File.open.description = Abrir una imagen en el visor actual mediante un selector de archivos.\nTambién puede arrastrar el archivo sobre el visor.
Action.File.openUri = Abrir URI...
Action.File.openUri.description = Abrir una imagen en el visor actual introduciendo su ruta.\nPuede usarse para añadir imágenes que no se corresponden con archivos locales (p. ej. alojadas en OMERO), pero tenga en cuenta que debe existir un lector de imágenes compatible para interpretarlas.
Action.File.reloadData = Recargar datos
Action.File.reloadData.description = Recargar los datos guardados previamente para la imagen actual.\nEsto proporciona una forma más drástica de 'deshacer' (aunque sin opción de 'rehacer').
Action.File.save = Guardar
Action.File.save.description = Guardar un archivo .qpdata para esta imagen.\nEste comando se usa mejor dentro de proyectos, donde QuPath elegirá la ubicación en la que guardar el archivo.
Action.File.saveAs = Guardar como...
Action.File.saveAs.description = Guardar un archivo .qpdata para esta imagen, especificando la ruta.\n¡Atención! Normalmente es mucho mejor usar proyectos y dejar que QuPath decida dónde almacenar los archivos de datos.

Action.File.importObjects = Importar objetos desde archivo...
Action.File.importObjects.description = Importar objetos desde archivos GeoJSON o .qpdata
Action.File.exportGeoJSON = Exportar objetos como GeoJSON...
Action.File.exportGeoJSON.description = Exportar objetos a un archivo en formato GeoJSON

Action.File.quit = Salir
Action.File.quit.description = Salir de QuPath



# Edit menu
Menu.Edit = Editar
Menu.Edit.Copy = Copiar al portapapeles

Action.Edit.undo = Deshacer
Action.Edit.undo.description = Deshacer la última acción en el visor actual.\nTenga en cuenta que la función de deshacer de QuPath es limitada y se desactiva por sí misma (por motivos de rendimiento) cuando hay muchos objetos presentes.\nEl límite puede ajustarse en las preferencias.
Action.Edit.redo = Rehacer
Action.Edit.redo.description = Rehacer la última acción en el visor actual.

Action.Edit.Copy.selectedObjects = Objetos seleccionados
Action.Edit.Copy.selectedObjects.description = Copiar los objetos seleccionados al portapapeles del sistema en formato GeoJSON
Action.Edit.Copy.annotationObjects = Objetos de anotación
Action.Edit.Copy.annotationObjects.description = Copiar todos los objetos de anotación al portapapeles del sistema en formato GeoJSON
Action.Edit.Copy.currentViewer = Visor actual
Action.Edit.Copy.currentViewer.description = Copiar el contenido del visor actual al portapapeles.\nTenga en cuenta que se crea una imagen RGB, que no contiene necesariamente los valores de píxel originales.
Action.Edit.Copy.mainWindowContent = Contenido de la ventana principal
Action.Edit.Copy.mainWindowContent.description = Copiar el contenido de la ventana principal de QuPath al portapapeles.\nIgnora cualquier ventana o cuadro de diálogo superpuesto.
Action.Edit.Copy.mainWindowScreenshot = Captura de la ventana principal
Action.Edit.Copy.mainWindowScreenshot.description = Copiar al portapapeles el área de la pantalla correspondiente a la ventana principal de QuPath.\nIncluye cualquier ventana o cuadro de diálogo superpuesto.
Action.Edit.Copy.fullScreenshot = Captura de pantalla completa
Action.Edit.Copy.fullScreenshot.description = Hacer una captura de pantalla y copiarla al portapapeles.

Action.Edit.paste = Pegar
Action.Edit.paste.description = Pegar el contenido del portapapeles del sistema, si es posible.\nSi el contenido del portapapeles son objetos GeoJSON, los objetos se pegarán en la imagen actual.\nEn caso contrario, cualquier texto encontrado se mostrará en el editor de scripts.
Action.Edit.pasteToCurrentPlane = Pegar objetos en el plano actual
Action.Edit.pasteToCurrentPlane.description = Pegar objetos GeoJSON del portapapeles del sistema en el corte z y el punto temporal actuales, si es posible.\nSe generarán nuevos identificadores de objeto si es necesario para evitar duplicados.
Action.Edit.resetPreferences = Restablecer preferencias
Action.Edit.resetPreference.description = Restablecer las preferencias a sus valores predeterminados.\nPuede resultar útil si experimenta problemas persistentes de aparición reciente con QuPath.

