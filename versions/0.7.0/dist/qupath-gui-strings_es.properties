Menu.Measure = Medir
Menu.Measure.GridViews = Vistas de cuadrícula

Action.Measure.maps = Mostrar mapas de mediciones
Action.Measure.maps.description = Ver las mediciones de las detecciones en su contexto mediante mapas interactivos codificados por color
Action.Measure.manager = Mostrar gestor de mediciones
Action.Measure.manager.description = Ver y, opcionalmente, eliminar mediciones de detecciones
Action.Measure.export = Exportar mediciones...
Action.Measure.export.description = Exportar mediciones resumidas de varias imágenes de un proyecto


