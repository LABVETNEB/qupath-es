# Drawing tools

Tools.move = Mover
Tools.move.description = Herramienta de movimiento, tanto para desplazarse por el visor (panorámica) como para mover objetos (traslación)
Tools.rectangle = Rectángulo
Tools.rectangle.description = Haga clic y arrastre para dibujar una anotación rectangular.\nMantenga pulsada la tecla 'Mayús' para restringir la forma a un cuadrado.
Tools.ellipse = Elipse
Tools.ellipse.description = Haga clic y arrastre para dibujar una anotación elíptica.\nMantenga pulsada la tecla 'Mayús' para restringir la forma a un círculo.
Tools.line = Línea
Tools.line.description = Haga clic y arrastre para dibujar una anotación lineal.\nHaga clic derecho en el botón de la barra de herramientas para cambiar opcionalmente al uso de puntas de flecha.
Tools.arrowStart = Flecha (inicio)
Tools.arrowEnd = Flecha (fin)
Tools.arrowDouble = Flecha (doble)
Tools.polygon = Polígono
Tools.polygon.description = Crear una anotación con forma de polígono cerrado.\nPuede hacer clic en puntos individuales (con doble clic para terminar) o hacer clic y arrastrar (y soltar el botón del ratón para terminar).
Tools.polyline = Polilínea
Tools.polyline.description = Crear una anotación con forma de polilínea (es decir, un polígono abierto).\nPuede hacer clic en puntos individuales (con doble clic para terminar) o hacer clic y arrastrar (y soltar el botón del ratón para terminar).
Tools.brush = Pincel
Tools.brush.description = Haga clic y arrastre para pintar con un pincel.\nDe forma predeterminada, el tamaño de la región dibujada depende del nivel de zoom del visor.
Tools.points = Puntos
Tools.points.description = Haga clic para añadir puntos a una anotación

Tools.selectionMode = Modo de selección
Tools.selectionMode.description = Activar o desactivar el modo de selección: convierte las herramientas de dibujo en herramientas de selección

