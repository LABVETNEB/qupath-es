# Analyze menu
Menu.Analyze = Analizar
Menu.Analyze.Preprocessing = Preprocesamiento
Menu.Analyze.Tiles = Teselas y superpíxeles
Menu.Analyze.CellDetection = Detección celular
Menu.Analyze.Features = Calcular características
Menu.Analyze.Spatial = Análisis espacial
Menu.Analyze.DensityMaps = Mapas de densidad

Action.Analyze.Preprocessing.estimateStainVectors = Estimar vectores de tinción...
Action.Analyze.Preprocessing.estimateStainVectors.description = Estimar los vectores de tinción para la deconvolución de color en imágenes de campo claro.\nPuede usarse cuando hay exactamente 2 tinciones (p. ej. hematoxilina y eosina, hematoxilina y DAB) para mejorar la separación de tinciones.

Action.Analyze.Tiles.createTiles = Crear teselas...
Action.Analyze.Tiles.createTiles.description = Crear teselas. Pueden ser útiles como parte de un flujo de trabajo mayor, por ejemplo añadiendo mediciones de intensidad a las teselas, entrenando un clasificador y fusionando después las teselas clasificadas para identificar regiones mayores.

Action.Analyze.Features.smoothedFeatures = Añadir características suavizadas...
Action.Analyze.Features.smoothedFeatures.description = Complementar las mediciones de los objetos de detección calculando una suma ponderada de las mediciones correspondientes de los objetos vecinos
Action.Analyze.Features.intensityFeatures = Añadir características de intensidad...
Action.Analyze.Features.intensityFeatures.description = Añadir a los objetos nuevas características basadas en la intensidad
Action.Analyze.Features.shapeFeatures = Añadir características de forma...
Action.Analyze.Features.shapeFeature.description = Añadir a los objetos nuevas características basadas en la forma

Action.Analyze.Spatial.distanceToAnnotations2D = Distancia a las anotaciones 2D...
Action.Analyze.Spatial.distanceToAnnotations2D.description = Calcular las distancias entre los centroides de las detecciones y la anotación más cercana de cada clasificación, usando cero si el centroide está dentro de la anotación.\nPor ejemplo, puede usarse para determinar la distancia de cada célula a una región 'mayor' que se ha anotado (p. ej. un área tumoral o un vaso sanguíneo).
Action.Analyze.Spatial.signedDistanceToAnnotations2D = Distancia con signo a las anotaciones 2D...
Action.Analyze.Spatial.signedDistanceToAnnotations2D.description = Calcular las distancias entre los centroides de las detecciones y la anotación más cercana de cada clasificación, usando la distancia negativa al límite si el centroide está dentro de la anotación.\nPor ejemplo, puede usarse para determinar la distancia de cada célula a una región 'mayor' que se ha anotado (p. ej. un área tumoral o un vaso sanguíneo).
Action.Analyze.Spatial.detectionCentroidDistances2D = Distancias entre centroides de detecciones 2D...
Action.Analyze.Spatial.detectionCentroidDistances2D.description = Calcular las distancias entre los centroides de las detecciones para cada clasificación.\nPor ejemplo, puede usarse para identificar la célula más cercana de un tipo determinado.


# View menu
Menu.View = Ver
Menu.View.Multiview = Vista múltiple
Menu.View.Zoom = Zoom
Menu.View.CellDisplay = Visualización de células
Menu.View.Multitouch = Gestos multitáctiles

Action.View.commandList = Mostrar lista de comandos
Action.View.commandList.description = Mostrar la lista de comandos (mucho más cómodo que navegar por los menús...)
Action.View.recentCommands = Mostrar comandos recientes
Action.View.recentCommands.description = Mostrar una lista con los comandos usados recientemente
Action.View.Multiview.gridMenu = Establecer tamaño de la cuadrícula
Action.View.Multiview.addRow = Añadir fila
Action.View.Multiview.addRow.description = Añadir una nueva fila de visores a la cuadrícula de vista múltiple.\nPermite ver dos o más imágenes una junto a otra (verticalmente).
Action.View.Multiview.addColumn = Añadir columna
Action.View.Multiview.addColumn.description = Añadir una nueva columna de visores a la cuadrícula de vista múltiple.\nPermite ver dos o más imágenes una junto a otra (horizontalmente).
Action.View.Multiview.removeRow = Quitar fila
Action.View.Multiview.removeRow.description = Quitar de la cuadrícula de vista múltiple la fila que contiene el visor actual, si es posible.\nLa última fila no puede quitarse.
Action.View.Multiview.removeColumn = Quitar columna
Action.View.Multiview.removeColumn.description = Quitar de la cuadrícula de vista múltiple la columna que contiene el visor actual, si es posible.\nLa última columna no puede quitarse.
Action.View.Multiview.resetGridSize = Restablecer tamaño de los visores
Action.View.Multiview.resetGridSize.description = Restablecer la cuadrícula de vista múltiple para que todos los visores tengan el mismo tamaño
Action.View.Multiview.closeViewer = Cerrar visor
Action.View.Multiview.closeViewer.description = Cerrar la imagen del visor actual.\nEs necesario hacerlo antes de poder quitar un visor de la cuadrícula de vista múltiple.
Action.View.channelViewer = Mostrar visor de canales
Action.View.channelViewer.description = Abrir una ventana que muestra los canales individuales de una imagen uno junto a otro.\nResulta útil al trabajar con imágenes de fluorescencia multiplexadas o multicanal.\nHaga clic derecho en el visor para ajustar la configuración.
Action.View.miniViewer = Mostrar minivisor
Action.View.miniViewer.description = Abrir una ventana de visor que muestra una vista del píxel situado bajo el cursor.\nResulta útil para ver la imagen ampliada y reducida al mismo tiempo.
Action.View.rotate = Rotar imagen...
Action.View.rotate.description = Rotar la imagen visualmente (solo afecta a la visualización: el sistema de coordenadas no cambia)
Action.View.viewTracker = Mostrar registrador de vistas
Action.View.viewTracker.description = Registrar los movimientos de zoom y desplazamiento dentro de un visor para reproducirlos y analizarlos después
Action.View.slideLabel = Mostrar etiqueta de la preparación
Action.View.slideLabel.description = Mostrar la etiqueta de la preparación asociada a la imagen del visor activo (si está disponible)
Action.View.inputDisplay = Mostrar entradas del usuario
Action.View.inputDisplay.description = Mostrar en pantalla los clics del ratón y las pulsaciones de teclas.\nResulta especialmente útil para demostraciones y tutoriales.
Action.View.memoryMonitor = Mostrar monitor de memoria
Action.View.memoryMonitor.description = Mostrar un cuadro de diálogo para controlar el uso de memoria de QuPath y vaciar la caché si es necesario
Action.View.Zoom.400 = 400%
Action.View.Zoom.400.description = Establecer el factor de zoom en 400% (submuestreo = 0.25)
Action.View.Zoom.100 = 100%
Action.View.Zoom.100.description = Establecer el factor de zoom en 400% (submuestreo = 1)
Action.View.Zoom.10 = 10%
Action.View.Zoom.10.description = Establecer el factor de zoom en 400% (submuestreo = 10)
Action.View.Zoom.1 = 1%
Action.View.Zoom.1.description = Establecer el factor de zoom en 400% (submuestreo = 100)
Action.View.Zoom.zoomIn = Acercar
Action.View.Zoom.zoomIn.description = Acercar el zoom en el visor actual
Action.View.Zoom.zoomOut = Alejar
Action.View.Zoom.zoomOut.description = Alejar el zoom en el visor actual
Action.View.Zoom.zoomToFit = Ajustar zoom a la ventana
Action.View.Zoom.zoomToFit.description = Ajustar el zoom del visor actual para que la imagen quepa completa
Action.View.Multitouch.allOn = Activar todos los gestos
Action.View.Multitouch.allOn.description = Activar todos los gestos multitáctiles para pantallas táctiles y paneles táctiles
Action.View.Multitouch.allOff = Desactivar todos los gestos
Action.View.Multitouch.allOff.description = Desactivar todos los gestos multitáctiles para pantallas táctiles y paneles táctiles
Action.View.Multitouch.scroll = Usar gestos de desplazamiento
Action.View.Multitouch.scroll.description = Activar o desactivar los gestos de desplazamiento para pantallas táctiles y paneles táctiles
Action.View.Multitouch.zoom = Usar gestos de zoom
Action.View.Multitouch.zoom.description = Activar o desactivar los gestos de zoom para pantallas táctiles y paneles táctiles
Action.View.Multitouch.rotate = Usar gestos de rotación
Action.View.Multitouch.rotate.description = Activar o desactivar los gestos de rotación para pantallas táctiles y paneles táctiles


# Objects menu
Menu.Objects = Objetos
Menu.Objects.Delete = Eliminar
Menu.Objects.Select = Seleccionar
Menu.Objects.Select.Detections = Seleccionar detecciones
Menu.Objects.Lock = Bloquear
Menu.Objects.Annotations = Anotaciones

Action.Objects.Delete.selected = Eliminar objetos seleccionados...
Action.Objects.Delete.selected.description = Eliminar los objetos actualmente seleccionados
Action.Objects.Delete.all = Eliminar todos los objetos
Action.Objects.Delete.all.description = Eliminar todos los objetos de la imagen actual
Action.Objects.Delete.annotations = Eliminar todas las anotaciones
Action.Objects.Delete.annotations.description = Eliminar todos los objetos de anotación de la imagen actual
Action.Objects.Delete.detections = Eliminar todas las detecciones
Action.Objects.Delete.detections.description = Eliminar todos los objetos de detección de la imagen actual

Action.Objects.Delete.imageBoundary = Eliminar objetos en los bordes de la imagen
Action.Objects.Delete.imageBoundary.description = Eliminar todos los objetos que tocan o cruzan el borde de la imagen
Action.Objects.Delete.selectedBoundary = Eliminar objetos que tocan el borde de la ROI seleccionada...
Action.Objects.Delete.selectedBoundary.description = Eliminar todos los objetos que tocan o cruzan el límite de los objetos seleccionados

Action.Objects.Select.reset = Restablecer selección
Action.Objects.Select.reset.description = Restablecer los objetos seleccionados en la imagen actual
Action.Objects.Select.tmaCores = Seleccionar cilindros TMA
Action.Objects.Select.tmaCores.description = Seleccionar todos los cilindros TMA de la imagen actual
Action.Objects.Select.annotations = Seleccionar anotaciones
Action.Objects.Select.annotations.description = Seleccionar todos los objetos de anotación de la imagen actual
Action.Objects.Select.detections = Seleccionar todas las detecciones
Action.Objects.Select.detections.description = Seleccionar todos los objetos de detección de la imagen actual (incluye células y teselas)
Action.Objects.Select.cells = Seleccionar células
Action.Objects.Select.cells.description = Seleccionar todos los objetos celulares de la imagen actual
Action.Objects.Select.tiles = Seleccionar teselas
Action.Objects.Select.tiles.description = Seleccionar todos los objetos de tesela de la imagen actual
Action.Objects.Select.selectByClassification = Seleccionar objetos por clasificación...
Action.Objects.Select.selectByClassification.description = Seleccionar objetos según su clasificación
Action.Objects.Select.selectOnCurrentPlane = Seleccionar objetos del plano actual
Action.Objects.Select.selectOnCurrentPlane.description = Seleccionar todos los objetos del plano actualmente visible en el visor

Action.Objects.Lock.lockSelected = Bloquear objetos seleccionados
Action.Objects.Lock.lockSelected.description = Bloquear todos los objetos actualmente seleccionados
Action.Objects.Lock.unlockSelected = Desbloquear objetos seleccionados
Action.Objects.Lock.unlockSelected.description = Desbloquear todos los objetos actualmente seleccionados
Action.Objects.Lock.toggleSelected = Alternar bloqueo de los objetos seleccionados
Action.Objects.Lock.toggleSelected.description = Alternar el estado 'bloqueado' de todos los objetos actualmente seleccionados

Action.Objects.Annotation.specify = Especificar anotación...
Action.Objects.Annotation.specify.description = Crear una anotación rectangular o elíptica con las propiedades indicadas
Action.Objects.Annotation.fullImage = Crear anotación de la imagen completa
Action.Objects.Annotation.fullImage.description = Crear una anotación que abarque todo el ancho y el alto de la imagen actual
Action.Objects.Annotation.hierarchyInsert = Insertar en la jerarquía
Action.Objects.Annotation.hierarchyInsert.description = Insertar los objetos seleccionados en la jerarquía de objetos.\nEsto implica resolver las relaciones padre-hijo a partir de las regiones de interés.
Action.Objects.Annotation.hierarchyResolve = Resolver jerarquía
Action.Objects.Annotation.hierarchyResolve.description = Resolver la jerarquía de objetos estableciendo las relaciones padre-hijo entre objetos a partir de las regiones de interés.
Action.Objects.Annotation.transform = Transformar anotaciones...
Action.Objects.Annotation.transform.description = Trasladar o rotar interactivamente la anotación seleccionada.
Action.Objects.Annotation.duplicate = Duplicar anotaciones seleccionadas
Action.Objects.Annotation.duplicate.description = Duplicar las anotaciones seleccionadas
Action.Objects.Annotation.copyToCurrentPlane = Copiar anotaciones al plano actual
Action.Objects.Annotation.copyToCurrentPlane.description = Duplicar los objetos seleccionados y pegarlos en el plano actual (es decir, el corte z y el punto temporal visibles en el visor).\nEsto evita usar el portapapeles del sistema. Está pensado para facilitar la transferencia rápida de anotaciones entre imágenes multidimensionales.
Action.Objects.Annotation.transferLast = Transferir la última anotación
Action.Objects.Annotation.transferLast.description = Transferir la última anotación a la imagen actual.\nPuede usarse para llevar anotaciones de un visor a otro, o para recuperar una anotación recién eliminada.
Action.Objects.Annotation.expand = Expandir anotaciones...
Action.Objects.Annotation.expand.description = Expandir (o contraer) las anotaciones seleccionadas, eliminando opcionalmente el interior.
Action.Objects.Annotation.split = Dividir anotaciones
Action.Objects.Annotation.split.description = Dividir en anotaciones separadas las anotaciones complejas que contienen partes inconexas
Action.Objects.Annotation.splitByLines = Dividir anotaciones mediante líneas...
Action.Objects.Annotation.splitByLines.description = Dividir anotaciones de área a lo largo de líneas definidas por anotaciones lineales
Action.Objects.Annotation.removeFragmentsFillHoles = Quitar fragmentos y huecos...
Action.Objects.Annotation.removeFragmentsFillHoles.description = Quitar los fragmentos pequeños de las anotaciones que contienen partes inconexas
Action.Objects.Annotation.fillHoles = Rellenar huecos
Action.Objects.Annotation.fillHoles.description = Rellenar los huecos existentes dentro de las anotaciones
Action.Objects.Annotation.makeInverse = Crear inversa
Action.Objects.Annotation.makeInverse.description = Crear anotaciones correspondientes a la 'inversa' de la anotación seleccionada.\nLa anotación inversa contiene 'todo lo demás' fuera de la anotación actual, limitado por su elemento padre.
Action.Objects.Annotation.mergeSelected = Fusionar seleccionadas
Action.Objects.Annotation.mergeSelected.description = Fusionar las anotaciones seleccionadas en una sola anotación.
Action.Objects.Annotation.simplify = Simplificar forma...
Action.Objects.Annotation.simplify.description = Simplificar las formas de las anotaciones seleccionadas.\nEsto elimina los vértices considerados innecesarios, según una tolerancia de amplitud determinada.

Action.Objects.refreshIds = Actualizar identificadores de objeto
Action.Objects.refreshIds.description = Actualizar todos los identificadores de objeto para garantizar que son únicos
Action.Objects.refreshDuplicateIds = Actualizar identificadores de objeto duplicados
Action.Objects.refreshDuplicateIds.description = Actualizar todos los identificadores de objeto duplicados para garantizar que son únicos

# Window menu
Menu.Window = Ventana
Action.Window.centerWindows = Centrar todas las ventanas
Action.Window.centerWindows.description = Mover todas las ventanas al centro de la pantalla
Action.Window.centerOffscreen = Centrar ventanas fuera de pantalla
Action.Window.centerOffscreen.description = Centrar todas las ventanas que estén parcial o totalmente fuera de la pantalla
Action.Window.systemMenubar = Usar la barra de menús del sistema
Action.Window.systemMenubar.description = Usar la barra de menús del sistema cuando sea posible.\nLa alternativa es añadir una barra de menús independiente a cada ventana.
Action.Window.imageName = Mostrar el nombre de la imagen
Action.Window.imageName.description = Mostrar el nombre de la imagen actual en la barra de título de la ventana principal.

# TMA menu
Menu.TMA = TMA
Menu.TMA.add = Añadir...
Menu.TMA.remove = Quitar...

Action.TMA.specifyGrid = Especificar cuadrícula TMA...
Action.TMA.specifyGrid.description = Crear una cuadrícula TMA manual, definiendo las etiquetas y el diámetro de los cilindros.\nOpcionalmente puede restringirse a una anotación rectangular.
Action.TMA.addRowAbove = Añadir fila TMA encima de la seleccionada
Action.TMA.addRowAbove.description = Añadir una fila a la cuadrícula TMA antes (encima) de la fila que contiene el objeto seleccionado
Action.TMA.addRowBelow = Añadir fila TMA debajo de la seleccionada
Action.TMA.addRowBelow.description = Añadir una fila a la cuadrícula TMA después (debajo) de la fila que contiene el objeto seleccionado
Action.TMA.addColumnBefore = Añadir columna TMA antes de la seleccionada
Action.TMA.addColumnBefore.description = Añadir una columna a la cuadrícula TMA antes (a la izquierda) de la columna que contiene el objeto seleccionado
Action.TMA.addColumnAfter = Añadir columna TMA después de la seleccionada
Action.TMA.addColumnAfter.description = Añadir una columna a la cuadrícula TMA después (a la derecha) de la columna que contiene el objeto seleccionado

Action.TMA.removeRow = Quitar fila TMA
Action.TMA.removeRow.description = Quitar de la cuadrícula TMA la fila que contiene el objeto seleccionado
Action.TMA.removeColumn = Quitar columna TMA
Action.TMA.removeColumn.description = Quitar de la cuadrícula TMA la columna que contiene el objeto seleccionado

Action.TMA.relabel = Reetiquetar cuadrícula TMA...
Action.TMA.relabel.description = Reetiquetar los cilindros de una cuadrícula TMA. Suele ser necesario tras añadir o eliminar filas o columnas.
Action.TMA.resetMetadata = Restablecer metadatos TMA
Action.TMA.resetMetadata.description = Eliminar todos los metadatos de la cuadrícula TMA de la imagen actual
Action.TMA.deleteGrid = Eliminar cuadrícula TMA
Action.TMA.deleteGrid.description = Eliminar por completo la cuadrícula TMA de la imagen actual
Action.TMA.findHull = Buscar detecciones en la envolvente convexa (TMA)
Action.TMA.findHull.description = Buscar todas las detecciones situadas en la envolvente convexa de las detecciones de un cilindro TMA.\nPuede usarse para localizar células situadas hacia el borde del cilindro, que después pueden eliminarse si es necesario.\nA menudo estas células producen mediciones menos fiables a causa de los artefactos.


# Automate menu
Menu.Automate = Automatizar
Action.Automate.scriptEditor = Editor de scripts
Action.Automate.scriptEditor.description = Abrir el editor de scripts
Action.Automate.scriptInterpreter = Intérprete de scripts
Action.Automate.scriptInterpreter.description = Abrir un intérprete para ejecutar scripts de forma interactiva, línea a línea.\n(En general, el editor de scripts resulta más útil).
Action.Automate.commandWorkflow = Mostrar historial de comandos del flujo de trabajo
Action.Automate.commandWorkflow.description = Mostrar un historial de los comandos aplicados a la imagen actual.\nTenga en cuenta que no es totalmente exhaustivo, porque no todos los comandos pueden registrarse.\nAun así, el historial de comandos es útil para generar automáticamente scripts de procesamiento por lotes.
Action.Automate.commandScript = Crear script a partir del historial de comandos
Action.Automate.commandScript.description = Crear un script a partir de las acciones registradas en el historial de comandos

